# Include inside nginx's http block. Serve the public endpoint over HTTPS.
# Addresses are POST bodies. Request and body logging are disabled here.
limit_req_zone $binary_remote_addr zone=plant_requests:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=plant_connections:10m;

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 2k;
    client_body_buffer_size 4k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        limit_req zone=plant_requests burst=8 nodelay;
        limit_conn plant_connections 4;
        proxy_pass http://127.0.0.1:8002;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
